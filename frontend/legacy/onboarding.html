<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scenear — Setup &amp; Onboarding</title>
<style>
/* ============================================================
   Scenear — Onboarding
   Shares design tokens / base components with frontend/index.html
   ============================================================ */
:root{
  --bg:#121315; --bg-lowest:#0d0e10;
  --surface-low:#1b1c1e; --surface:#1f2022; --surface-high:#292a2c; --surface-highest:#343537;
  --on-surface:#e3e2e5; --on-variant:#c2c6d6;
  --outline:#8c909f; --outline-variant:#424754;
  --line:rgba(66,71,84,.35); --line-strong:rgba(66,71,84,.6);
  --primary:#adc6ff; --on-primary:#002e6a; --primary-dim:#4d8eff;
  --secondary:#b9c8de; --tertiary:#ffb786; --on-tertiary:#502400;
  --error:#ffb4ab; --ok:#7dd8a0; --warning:#e8b339;
  --font-sans:"Geist",ui-sans-serif,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r-sm:4px; --r-md:6px; --r-lg:8px;
  --ease:cubic-bezier(.2,.7,.2,1);
}
html[data-theme="light"]{
  --bg:#f4f4f6; --bg-lowest:#ffffff;
  --surface-low:#f0f0f3; --surface:#e8e8ec; --surface-high:#dedee3; --surface-highest:#d3d3d9;
  --on-surface:#1b1b1e; --on-variant:#4d4d57;
  --outline:#7c7c88; --outline-variant:#cfcfd6;
  --line:rgba(207,207,214,.9); --line-strong:rgba(150,150,160,.55);
  --primary:#2e63c8; --on-primary:#ffffff; --primary-dim:#4d8eff;
  --secondary:#55617a; --tertiary:#b5450f; --on-tertiary:#ffffff;
  --error:#b3261e; --ok:#1f7a4d; --warning:#a06600;
}
*{box-sizing:border-box;margin:0;padding:0}
html{color-scheme:dark}
html[data-theme="light"]{color-scheme:light}
html,body{height:100%}
body{
  background:var(--bg); color:var(--on-surface);
  font-family:var(--font-sans); font-size:13px; line-height:18px;
  letter-spacing:-0.003em; -webkit-font-smoothing:antialiased; overscroll-behavior:none;
}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font-family:inherit;color:inherit}
a{color:inherit;text-decoration:none}
.hidden{display:none!important}
.icon{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.icon-sm{width:14px;height:14px}
/* ---------- shared components (kept identical to main app) ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 16px;border-radius:8px;font-size:13px;color:var(--on-variant);background:var(--surface-low);border:1px solid transparent;user-select:none;transition:color .15s var(--ease),background .15s var(--ease),border-color .15s var(--ease),opacity .15s var(--ease)}
.btn:hover{color:var(--on-surface);border-color:var(--line-strong)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.45;cursor:default;pointer-events:none}
.btn-primary{background:var(--primary);color:var(--on-primary);font-weight:600;border-color:transparent}
.btn-primary:hover{background:var(--primary-dim);border-color:transparent}
.btn-ghost{background:transparent;color:var(--outline)}
.btn-ghost:hover{color:var(--on-surface);background:transparent}
.btn-link{background:none;border:none;color:var(--primary);font-size:12px;cursor:pointer;padding:2px}
.btn-link.dim{color:var(--on-variant)}
.btn-link:hover{text-decoration:underline}
.input{width:100%;height:44px;padding:0 14px;background:var(--surface-low);color:var(--on-surface);border:1px solid var(--line);border-radius:8px;font-size:14px;outline:none;transition:background .15s var(--ease),border-color .15s var(--ease)}
.input::placeholder{color:var(--outline)}
.input:focus{background:var(--surface);border-color:var(--primary-dim)}
.input-group{position:relative;display:flex;align-items:center;width:100%}
.input-group .input{padding-right:40px}
.eye-btn{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:32px;height:32px;display:flex;align-items:center;justify-content:center;border:none;background:none;color:var(--outline);cursor:pointer;border-radius:6px;transition:color .12s var(--ease),background .12s var(--ease)}
.eye-btn:hover{color:var(--on-surface);background:var(--surface-high)}
.select-wrap{position:relative}
.select{width:100%;height:44px;padding:0 34px 0 14px;appearance:none;background:var(--surface-low);border:1px solid var(--line);border-radius:8px;font-size:14px;color:var(--on-surface);outline:none;cursor:pointer;transition:background .15s var(--ease),border-color .15s var(--ease)}
.select:focus{background:var(--surface);border-color:var(--primary-dim)}
.select-arrow{position:absolute;right:11px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--outline)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;font-size:12.5px;color:var(--on-variant);background:var(--surface-low);border:1px solid var(--line);border-radius:99px;cursor:pointer;transition:color .15s var(--ease),background .15s var(--ease),border-color .15s var(--ease)}
.chip:hover{color:var(--on-surface);border-color:var(--outline)}
.chip.active{color:var(--on-primary);background:var(--primary);border-color:transparent;font-weight:600}
.chip[disabled]{opacity:.4;cursor:not-allowed}
.chip .chip-x{margin-left:2px;opacity:.6}
.chip .chip-x:hover{opacity:1}
label.flabel{display:block;font-size:12.5px;font-weight:600;letter-spacing:.01em;color:var(--on-variant);margin-bottom:7px}
::selection{background:var(--primary);color:var(--on-primary)}
/* ---------- toast ---------- */
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(12px);z-index:500;background:var(--surface-high);border:1px solid var(--line-strong);color:var(--on-surface);padding:10px 16px;border-radius:9px;font-size:12.5px;line-height:1.55;max-width:min(480px,calc(100vw - 48px));box-shadow:0 8px 28px rgba(0,0,0,.2);opacity:0;pointer-events:none;transition:opacity .22s var(--ease),transform .22s var(--ease)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.error{border-color:color-mix(in srgb,var(--error) 55%,var(--line-strong));color:var(--error)}
.toast.ok{border-color:color-mix(in srgb,var(--ok) 55%,var(--line-strong))}
/* ============================================================
   Onboarding-specific layout
   ============================================================ */
.ob-stage{
  min-height:100vh;width:100%;display:flex;align-items:center;justify-content:center;
  padding:48px 20px;position:relative;overflow:hidden;
}
.ob-stage::before{
  content:"";position:absolute;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(ellipse 900px 560px at 14% -8%, color-mix(in srgb,var(--primary) 13%,transparent), transparent 60%),
    radial-gradient(ellipse 760px 520px at 100% 108%, color-mix(in srgb,var(--tertiary) 8%,transparent), transparent 60%);
}
.ob-lang-toggle{position:fixed;top:18px;right:20px;z-index:5;font-size:11.5px;color:var(--outline);display:flex;align-items:center;gap:2px}
.ob-lang-toggle button{padding:5px 9px;border-radius:6px;color:var(--outline)}
.ob-lang-toggle button.active{color:var(--on-surface);background:var(--surface-high)}
.ob-shell{
  position:relative;z-index:1;width:min(600px,100%);
  background:var(--surface);border:1px solid var(--line-strong);border-radius:20px;
  box-shadow:0 30px 80px rgba(0,0,0,.38),0 4px 18px rgba(0,0,0,.18);
  padding:34px 38px 28px;display:flex;flex-direction:column;gap:26px;
}
html[data-theme="light"] .ob-shell{box-shadow:0 30px 80px rgba(20,24,32,.16),0 4px 18px rgba(20,24,32,.08)}
.ob-brand{display:flex;align-items:baseline;gap:9px}
.ob-brand-mark{font-size:15px;font-weight:700;letter-spacing:.02em}
.ob-brand-sub{font-size:11px;color:var(--outline)}
/* ---- step rail ---- */
.ob-rail{display:flex;align-items:flex-start;gap:0}
.ob-rail-step{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;position:relative}
.ob-rail-line{position:absolute;top:14px;left:-50%;width:100%;height:2px;background:var(--line);z-index:0}
.ob-rail-step:first-child .ob-rail-line{display:none}
.ob-rail-line.done{background:var(--primary-dim)}
.ob-rail-dot{
  position:relative;z-index:1;width:28px;height:28px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:11px;
  background:var(--surface-high);color:var(--outline);border:1px solid var(--line-strong);
  transition:all .18s var(--ease);
}
.ob-rail-step.current .ob-rail-dot{background:var(--primary);color:var(--on-primary);border-color:transparent;box-shadow:0 0 0 4px color-mix(in srgb,var(--primary) 20%,transparent)}
.ob-rail-step.done .ob-rail-dot{background:var(--primary-dim);color:var(--on-primary);border-color:transparent;cursor:pointer}
.ob-rail-step.done .ob-rail-dot:hover{filter:brightness(1.12)}
.ob-rail-step.done .ob-rail-dot .icon{width:14px;height:14px}
.ob-rail-label{font-size:10.5px;color:var(--outline);white-space:nowrap}
.ob-rail-step.current .ob-rail-label{color:var(--on-surface);font-weight:600}
.ob-rail-step.done .ob-rail-label{color:var(--on-variant);cursor:pointer}
/* ---- head ---- */
.ob-head{display:flex;flex-direction:column;gap:5px}
.ob-title{font-size:19px;font-weight:700;letter-spacing:-.015em}
.ob-sub{font-size:12.5px;color:var(--on-variant);line-height:1.6;max-width:92%}
/* ---- content transition ---- */
.ob-content{min-height:430px;max-height:60vh;overflow-y:auto;overflow-x:hidden;padding-right:2px;animation:obIn .22s var(--ease)}
@keyframes obIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes obPop{0%{transform:scale(.55);opacity:0}65%{transform:scale(1.1);opacity:1}100%{transform:scale(1)}}
@keyframes obShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-4px)}40%{transform:translateX(4px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
.ob-status.ok .icon{animation:obPop .32s var(--ease)}
.ob-status.err{animation:obShake .34s var(--ease)}
.ob-suggest{margin-top:8px}
.ob-suggest .chip{font-size:11.5px;padding:5px 11px}
.ob-req-mark{color:var(--tertiary);margin-left:3px}
/* ---- account step ---- */
.ob-tabs{display:flex;gap:2px;padding:3px;background:var(--surface-low);border:1px solid var(--line);border-radius:9px;margin-bottom:18px}
.ob-tab{flex:1;text-align:center;padding:8px 0;border-radius:7px;font-size:12.5px;color:var(--on-variant);transition:all .15s var(--ease)}
.ob-tab.active{background:var(--surface-high);color:var(--on-surface);font-weight:600}
.ob-field{display:flex;flex-direction:column;gap:14px}
.ob-err{font-size:11.5px;color:var(--error);min-height:14px}
.ob-guest-row{display:flex;justify-content:center;margin-top:16px}
/* ---- llm step ---- */
.ob-llm-grid{display:flex;flex-direction:column;gap:14px}
.ob-llm-2col{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.ob-hint{font-size:11px;color:var(--outline);line-height:1.6;margin-top:2px}
/* ---- survey step ---- */
.ob-qcard{display:flex;flex-direction:column;gap:8px;padding:16px 0;border-bottom:1px solid var(--line)}
.ob-qcard:last-child{border-bottom:none;padding-bottom:0}
.ob-qname{font-size:13.5px;font-weight:600}
.ob-qdesc{font-size:11.5px;color:var(--outline);line-height:1.55}
.ob-chip-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:2px}
/* ---- confirm step ---- */
.ob-summary-row{display:flex;flex-wrap:wrap;gap:8px}
.ob-tag{font-size:11px;color:var(--on-variant);background:var(--surface-low);border:1px solid var(--line);border-radius:99px;padding:5px 11px}
.ob-block{background:var(--bg-lowest);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.ob-block-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.ob-block-title{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--on-variant);font-weight:600}
.ob-portrait-line{font-size:12px;line-height:1.7;color:var(--on-variant)}
.ob-portrait-line b{color:var(--on-surface);font-weight:600}
.ob-rec-group{display:flex;flex-direction:column;gap:6px}
.ob-rec-label{font-size:10.5px;color:var(--outline)}
.ob-rec-chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ob-rec-add{display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 10px 0 6px;font-size:11.5px;color:var(--outline);border:1px dashed var(--line-strong);border-radius:99px}
.ob-rec-add input{background:none;border:none;outline:none;color:var(--on-surface);font-size:11.5px;width:74px}
.ob-notice{display:flex;align-items:flex-start;gap:9px;padding:11px 13px;border-radius:10px;font-size:11.5px;line-height:1.6}
.ob-notice.warn{background:color-mix(in srgb,var(--warning) 12%,transparent);border:1px solid color-mix(in srgb,var(--warning) 35%,var(--line));color:var(--warning)}
.ob-notice.info{background:var(--surface-low);border:1px solid var(--line);color:var(--on-variant)}
.ob-notice .icon{width:15px;height:15px;flex-shrink:0;margin-top:1px}
/* ---- busy / result states ---- */
.spin{width:14px;height:14px;border-radius:50%;border:2px solid color-mix(in srgb,currentColor 30%,transparent);border-top-color:currentColor;animation:spin .7s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}
.ob-status{display:flex;align-items:center;gap:9px;padding:11px 13px;border-radius:10px;font-size:12px;line-height:1.5}
.ob-status.busy{background:var(--surface-low);border:1px solid var(--line);color:var(--on-variant)}
.ob-status.ok{background:color-mix(in srgb,var(--ok) 12%,transparent);border:1px solid color-mix(in srgb,var(--ok) 40%,var(--line));color:var(--ok)}
.ob-status.err{background:color-mix(in srgb,var(--error) 12%,transparent);border:1px solid color-mix(in srgb,var(--error) 40%,var(--line));color:var(--error)}
.ob-status .icon{width:16px;height:16px;flex-shrink:0}
/* ---- foot ---- */
.ob-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:4px;border-top:1px solid var(--line);margin-top:2px}
.ob-foot-left{display:flex;align-items:center;gap:14px}
.ob-dev-skip{font-size:10.5px;color:var(--outline);opacity:.6}
.ob-dev-skip:hover{opacity:1}
@media (max-width:640px){
  .ob-shell{padding:26px 20px 22px;border-radius:16px;gap:20px}
  .ob-llm-2col{grid-template-columns:1fr}
  .ob-rail-label{display:none}
  .ob-sub{max-width:100%}
}
</style>
</head>

<script>
const API_ORIGIN = (function () {
  try { const ov = JSON.parse(localStorage.getItem('telg-settings') || 'null'); if (ov && ov.backendBase) return String(ov.backendBase).replace(/\/+$/, ''); } catch (e) {}
  return 'http://127.0.0.1:8000';
})();
const CONFIG = { apiBase: API_ORIGIN + '/api/v1' };
const DEV_TOOLS = true; // dev/test only — remove every DEV_TOOLS branch before production release
const ROLE_SUGGESTIONS = ['嵌入式软件工程师','AI 算法工程师','半导体工艺工程师','电力电子工程师'];

  { id: 'automotive', name: 'Automotive' }, { id: 'semiconductor', name: 'Semiconductor' },
  { id: 'energy', name: 'New Energy' }, { id: 'ai-software', name: 'AI / Software' },
  { id: 'medical', name: 'Medical Devices' }, { id: 'fintech', name: 'FinTech' },
  { id: 'aerospace', name: 'Aerospace' }, { id: 'general', name: 'General Engineering' }
];
const MINUTE_PRESETS = [15, 30, 45, 60];
function escapeHtml(x){ return String(x==null?'':x).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
const STEPS = ['account','llm','survey','confirm'];
const T = {
  zh: {
    brandSub: '为耳朵定制，让场景掷地有声。',
    stepLabels: ['账号', 'LLM 配置', '个性化', '确认'],
    'acc.title': '欢迎使用 场景听',
    'acc.sub': '创建本地账号以开始使用，账号数据仅保存在本机浏览器。',
    'acc.tabRegister': '创建账号', 'acc.tabLogin': '登录',
    'acc.username': '用户名', 'acc.password': '密码', 'acc.password2': '确认密码',
    'acc.needUser': '请输入用户名', 'acc.pwShort': '密码太短（至少 4 位）', 'acc.pwMismatch': '两次密码不一致',
    'acc.hasAccount': '本机已存在账号，请登录', 'acc.noAccount': '本机无账号，请先创建',

function validateLLMCfg(cfg){

async function apiFetch(path, opts, timeoutMs){
  const ctrl = new AbortController();
  const timer = setTimeout(()=>ctrl.abort(), timeoutMs||60000);
  let res;
  try{ res = await fetch(CONFIG.apiBase+path, Object.assign({signal:ctrl.signal}, opts||{})); }
  catch(e){ clearTimeout(timer); throw new Error('Cannot reach backend at '+CONFIG.apiBase+' — start FastAPI (backend/main.py) on port 8000'); }
  clearTimeout(timer);
  const ct=(res.headers.get('content-type')||'').toLowerCase();
  if(!ct.includes('application/json')){ throw new Error('Backend returned non-JSON ('+res.status+') — open via http://127.0.0.1:8000, not a static server'); }
  const data = await res.json();
  if(!res.ok){ const msg = data && data.detail ? (typeof data.detail==='string'?data.detail:JSON.stringify(data.detail)) : ('HTTP '+res.status); throw new Error(msg); }
  return data;
}
function showToast(msg,type){
  const wrap=document.getElementById('toast-wrap'); if(!wrap) return;
  const el=document.createElement('div'); el.className='toast '+(type||'ok'); el.textContent=msg;
  wrap.appendChild(el); requestAnimationFrame(()=>el.classList.add('show'));
  setTimeout(()=>{ el.classList.remove('show'); setTimeout(()=>el.remove(),250); }, 3200);
}
const AuthAPI = {
  _key:'telg-auth',
  _read(){ try{ return JSON.parse(localStorage.getItem(this._key)||'null')||null; }catch(e){ return null; } },
  _write(a){ try{ localStorage.setItem(this._key, JSON.stringify(a)); }catch(e){} },
  async _hash(salt,pw){
    try{ const buf=await crypto.subtle.digest('SHA-256', new TextEncoder().encode(salt+'::'+pw)); return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join(''); }
    catch(e){ let h=0; const t=salt+'::'+pw; for(let i=0;i<t.length;i++) h=(h*31+t.charCodeAt(i))>>>0; return 'f'+h.toString(16); }
  },
  async register(a){
    const username=((a&&a.username)||'').trim(); const password=(a&&a.password)||'';
    if(!username) return {ok:false, error:L()['acc.needUser']};
    if(password.length<4) return {ok:false, error:L()['acc.pwShort']};
    if(this._read()) return {ok:false, error:L()['acc.hasAccount']};
    const salt=Math.random().toString(36).slice(2)+Date.now().toString(36);
    this._write({username, salt, passHash: await this._hash(salt,password), created_at:Date.now(), session:true});
    return {ok:true, user:{username}};
  },
  async login(a){
    const username=((a&&a.username)||'').trim(); const password=(a&&a.password)||'';
    const acc=this._read();
    if(!acc) return {ok:false, error:L()['acc.noAccount']};
    if(acc.username!==username) return {ok:false, error:L()['acc.wrongUser']};
    if((await this._hash(acc.salt,password))!==acc.passHash) return {ok:false, error:L()['acc.wrongPw']};
    acc.session=true; this._write(acc);
    return {ok:true, user:{username:acc.username}};
  },
  current(){ const a=this._read(); return (a&&a.session)?{username:a.username}:null; },
  exists(){ return !!this._read(); }
};

    + '<div class="ob-qcard"><div class="ob-qname">'+escapeHtml(t['sv.lang'])+'</div><div class="ob-qdesc">'+escapeHtml(t['sv.langDesc'])+'</div>'
      + '<div class="ob-chip-row" id="sv-lang-row">'+chips+'</div></div>'
    + '<div class="ob-qcard"><div class="ob-qname">'+escapeHtml(t['sv.minutes'])+'</div><div class="ob-qdesc">'+escapeHtml(t['sv.minutesDesc'])+'</div>'
      + '<div class="ob-chip-row" id="sv-min-row">'+minuteChips+'</div></div>'
    + '<div id="sv-status"></div>';
  document.getElementById('sv-lang-row').addEventListener('click', e=>{
    const chip = e.target.closest('.chip'); if(!chip || chip.disabled) return;
    state.survey.language = chip.dataset.val;
    document.querySelectorAll('#sv-lang-row .chip').forEach(c=>c.classList.toggle('active', c===chip));
  });
  document.getElementById('ob-back').classList.remove('hidden');
  document.getElementById('ob-back').textContent = t.back;
  document.getElementById('ob-next').textContent = t['sv.next'];
  document.getElementById('ob-next').disabled = false;
  const devSkip = document.getElementById('ob-dev-skip');
  if(DEV_TOOLS){ devSkip.classList.remove('hidden'); devSkip.dataset.action='preview-step4'; devSkip.textContent=t['sv.devPreview']; }
  else devSkip.classList.add('hidden');
}
async function surveyNext(){
  const t=L();
  const role = document.getElementById('sv-role').value.trim();
  const domain = document.getElementById('sv-domain').value.trim();
  const minutes = state.survey.minutes;
  const statusEl = document.getElementById('sv-status');
  if(!domain){ statusEl.innerHTML = statusHtml('err', t['sv.needDomain']); return; }
  if(!(minutes>0)){ statusEl.innerHTML = statusHtml('err', t['sv.needMin']); return; }
  state.survey.role=role; state.survey.domain=domain; state.survey.minutes=minutes;
  try{ localStorage.setItem('telg-profile-answers', JSON.stringify(state.survey)); }catch(e){}
  if(!state.llmOk){ state.gen=null; state.genLlmSnapshot=null; advanceTo(3); return; }
  const next = document.getElementById('ob-next');
  next.disabled = true;
  statusEl.innerHTML = statusHtml('busy', t['sv.generating']);
  try{
    const payload = { role, domain, language: state.survey.language, focus:'', minutes, llm_config: state.llm };
    state.gen = await apiFetch('/config/onboarding/generate', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload)}, 120000);
    state.genLlmSnapshot = Object.assign({}, state.llm);
    state.llmChangedSinceGen = false;
    advanceTo(3);
  }catch(e){
    statusEl.innerHTML = statusHtml('err', t['sv.genFail']+': '+e.message);
  }finally{
    next.disabled = false;
  }
}
/* ---------------- step 3: confirm ---------------- */
function langLabel(v){ const d=LANG_DEFS.find(x=>x[0]===v); return d?d[1]:v; }
function renderConfirm(){
  const t=L();
  document.getElementById('ob-title').textContent = t['cf.title'];
  document.getElementById('ob-sub').textContent = t['cf.sub'];
  const s = state.survey, g = state.gen;
  let h = '<div class="ob-summary-row">'
    + '<span class="ob-tag">'+escapeHtml(t['cf.role'])+': '+escapeHtml(s.role||'—')+'</span>'
    + '<span class="ob-tag">'+escapeHtml(t['cf.domain'])+': '+escapeHtml(s.domain)+'</span>'
    + '<span class="ob-tag">'+escapeHtml(t['cf.lang'])+': '+escapeHtml(langLabel(s.language))+'</span>'
    + '<span class="ob-tag">'+escapeHtml(t['cf.minutes'])+': '+s.minutes+'</span>'
    + '</div>';
  if(state.llmChangedSinceGen && g){
    h += '<div class="ob-notice warn"><svg class="icon"><use href="#i-alert-triangle"/></svg><div>'+escapeHtml(t['cf.needLlmChanged'])+'</div></div>';
  }
  if(g){
    h += '<div class="ob-block">'
      + '<div class="ob-block-head"><div class="ob-block-title">'+escapeHtml(t['cf.rolePortrait'])+' · '+escapeHtml(t['cf.domainProfile'])+'</div></div>'
      + '<div class="ob-portrait-line">'+escapeHtml(g.role_portrait||'—')+'</div>'
      + '<div class="ob-portrait-line">'+escapeHtml(g.domain_profile||'')+'</div>'
      + (g.focus_tone ? '<div class="ob-portrait-line"><b>'+escapeHtml(t['cf.focusTone'])+':</b> '+escapeHtml(g.focus_tone)+'</div>' : '')
      + '</div>';
    h += '<div class="ob-block">'
      + '<div class="ob-block-head"><div class="ob-block-title">'+escapeHtml(t['cf.recTitle'])+'</div><button class="btn-link" id="cf-regen">'+escapeHtml(t['cf.regenAll'])+'</button></div>'
      + recGroupHtml('domains', t['cf.recDomains'], (g.domains||[]).map(d=>d.name||d))
      + recGroupHtml('roles', t['cf.recRoles'], g.roles||[])
      + recGroupHtml('scenarios', t['cf.recScenarios'], g.scenarios||[])
      + '</div>';
  } else {
    h += '<div class="ob-notice info"><svg class="icon"><use href="#i-info-circle"/></svg><div>'+escapeHtml(t['cf.noGen'])+'</div></div>';
  }
  h += '<div id="cf-status"></div>';
  document.getElementById('ob-content').innerHTML = h;
  if(g) bindRecEvents();
  document.getElementById('ob-back').classList.remove('hidden');
  document.getElementById('ob-back').textContent = t.back;
  document.getElementById('ob-next').textContent = t['cf.next'];
  document.getElementById('ob-next').disabled = false;
  document.getElementById('ob-dev-skip').classList.add('hidden');
}
function recGroupHtml(key, label, items){
  const chips = (items||[]).map((v,i)=>'<span class="chip" data-group="'+key+'" data-i="'+i+'">'+escapeHtml(v)+'<span class="chip-x" data-del="'+key+':'+i+'"><svg class="icon icon-sm"><use href="#i-x"/></svg></span></span>').join('');
  return '<div class="ob-rec-group"><div class="ob-rec-label">'+escapeHtml(label)+'</div><div class="ob-rec-chips" data-recgroup="'+key+'">'
    + chips
    + '<span class="ob-rec-add"><svg class="icon icon-sm"><use href="#i-plus"/></svg><input placeholder="'+escapeHtml(L()['cf.addPh'])+'" data-addto="'+key+'"></span>'
    + '</div></div>';
}
function recArray(key){
  const g = state.gen;
  if(key==='domains') return (g.domains||[]).map(d=> typeof d==='string' ? d : (d.name||''));
  return g[key]||[];
}
function setRecArray(key, arr){
  if(key==='domains') state.gen.domains = arr.map(name=>({name}));
  else state.gen[key] = arr;
}
function bindRecEvents(){
  document.getElementById('cf-regen').addEventListener('click', confirmRegenAll);
  document.querySelectorAll('[data-del]').forEach(el=>{
    el.addEventListener('click', e=>{
      e.stopPropagation();
      const [key,idx] = el.dataset.del.split(':');
      const arr = recArray(key); arr.splice(parseInt(idx,10),1); setRecArray(key,arr);
      renderConfirm();
    });
  });
  document.querySelectorAll('[data-addto]').forEach(inp=>{
    inp.addEventListener('keydown', e=>{
      if(e.key!=='Enter') return;
      const v = inp.value.trim(); if(!v) return;
      const key = inp.dataset.addto; const arr = recArray(key); arr.push(v); setRecArray(key,arr);
      renderConfirm();
    });
  });
}
async function confirmRegenAll(){
  const t=L();
  const statusEl = document.getElementById('cf-status');
  statusEl.innerHTML = statusHtml('busy', t['sv.generating']);
  try{
    const payload = { role: state.survey.role, domain: state.survey.domain, language: state.survey.language, focus:'', minutes: state.survey.minutes, llm_config: state.llm };
    state.gen = await apiFetch('/config/onboarding/generate', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload)}, 120000);
    state.genLlmSnapshot = Object.assign({}, state.llm);
    state.llmChangedSinceGen = false;
    renderConfirm();
  }catch(e){
    statusEl.innerHTML = statusHtml('err', t['sv.genFail']+': '+e.message);
  }
}
function confirmFinish(){
  const t=L();
  const cfg = readStoredCfg();
  cfg.goalMin = String(state.survey.minutes);
  const g = state.gen;
  /* v2 profile: structured arrays — practice domains (name→id resolved for
     built-ins) and conversation speakers. Legacy single-value fields are kept
     so older frontend code paths still find something. */
  const domainName = state.survey.domain;
  const builtinDomain = BUILTIN_DOMAINS.find(d => d.name === domainName || d.id === domainName);
  cfg.profile = {
    domains: [builtinDomain ? builtinDomain.id : domainName],
    roles: state.survey.role ? [state.survey.role] : [],
    primaryDomain: domainName, role: state.survey.role,
    language: state.survey.language, minutes: state.survey.minutes,
    scenarios: [], focus: '', generated: !!g,
    rolePortrait: g ? (g.role_portrait||'') : '', domainProfile: g ? (g.domain_profile||'') : '', focusTone: g ? (g.focus_tone||'') : ''
  };
  if(g) cfg.recommendations = { domains: g.domains||[], roles: g.roles||[], scenarios: g.scenarios||[], generatedAt: Date.now(), model:(cfg.llm||{}).model||'' };
  writeStoredCfg(cfg);
  writeOnboarding({done:true, at:Date.now()});
  showToast(t['cf.ready'],'ok');
  setTimeout(()=>{ location.href='index.html'; }, 550);
}
/* ---------------- shared helpers ---------------- */
function statusHtml(kind, msg){
  const icon = kind==='ok' ? '<svg class="icon"><use href="#i-check"/></svg>' : kind==='err' ? '<svg class="icon"><use href="#i-x-circle"/></svg>' : '<span class="spin"></span>';
  return '<div class="ob-status '+kind+'">'+icon+'<div>'+escapeHtml(msg)+'</div></div>';
}
function advanceTo(i){
  state.stepIdx = i;
  state.maxReached = Math.max(state.maxReached, i);
  render();
}
function obNext(){
  if(state.stepIdx===0) return accountNext();
  if(state.stepIdx===1) return llmNext();
  if(state.stepIdx===2) return surveyNext();
  if(state.stepIdx===3) return confirmFinish();
}
function obBack(){
  if(state.stepIdx>0) goToStep(state.stepIdx-1);
}
document.addEventListener('click', function(e){
  if(e.target.closest('#ob-next')){ obNext(); return; }
  if(e.target.closest('#ob-back')){ obBack(); return; }
  if(e.target.closest('#ob-dev-skip')){ const act=e.target.closest('#ob-dev-skip').dataset.action; if(act==='preview-step4') devPreviewStep4(); else llmDevSkip(); return; }
  if(e.target.closest('#acc-guest')){ accountGuest(); return; }
  const tab = e.target.closest('.ob-tab');
  if(tab){ state.accMode = tab.dataset.mode; renderAccount(); return; }
  const railStep = e.target.closest('.ob-rail-step.done');
  if(railStep){ goToStep(parseInt(railStep.dataset.idx,10)); return; }
  const sug = e.target.closest('[data-fill]');
  if(sug){ const el=document.getElementById(sug.dataset.target); if(el) el.value = sug.dataset.fill; return; }
  const mchip = e.target.closest('[data-minset]');
  if(mchip){
    state.survey.minutes = parseInt(mchip.dataset.minset,10);
    document.querySelectorAll('#sv-min-row .chip').forEach(c=>c.classList.toggle('active', c===mchip));
    return;
  }
  const langBtn = e.target.closest('.ob-lang-toggle button');
  if(langBtn){ state.lang = langBtn.dataset.lang; try{ localStorage.setItem('telg-lang', state.lang); }catch(err){} render(); return; }
});
function init(){
  applyTheme();
  document.querySelectorAll('.ob-lang-toggle button').forEach(b=>b.classList.toggle('active', b.dataset.lang===state.lang));
  if(AuthAPI.current()){ state.accMode='login'; state.maxReached=1; state.stepIdx=1; render(); }
  else { render(); }
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', init);
else init();
</script>
</body>
</html>
