<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TELG — Setup & Onboarding</title>
<style>


/* ============================================================
   TELG — Technical English Listening Generator
   Design tokens · Components · Views
   Deep theme (default) + Light theme via html[data-theme]
   ============================================================ */
:root{
  /* surfaces */
  --bg:#121315; --bg-lowest:#0d0e10;
  --surface-low:#1b1c1e; --surface:#1f2022; --surface-high:#292a2c; --surface-highest:#343537;
  --on-surface:#e3e2e5; --on-variant:#c2c6d6;
  --outline:#8c909f; --outline-variant:#424754;
  --line:rgba(66,71,84,.35); --line-strong:rgba(66,71,84,.6);
  /* accent */
  --primary:#adc6ff; --on-primary:#002e6a; --primary-dim:#4d8eff;
  --secondary:#b9c8de; --tertiary:#ffb786; --on-tertiary:#502400;
  --error:#ffb4ab; --ok:#7dd8a0;
  /* type */
  --font-sans:"Geist",ui-sans-serif,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  /* radius */
  --r-sm:4px; --r-md:6px; --r-lg:8px;
  --ease:cubic-bezier(.2,.7,.2,1);
}
html[data-theme="light"]{
  --bg:#f4f4f6; --bg-lowest:#ffffff;
  --surface-low:#f0f0f3; --surface:#e8e8ec; --surface-high:#dedee3; --surface-highest:#d3d3d9;
  --on-surface:#1b1b1e; --on-variant:#4d4d57;
  --outline:#7c7c88; --outline-variant:#cfcfd6;
  --line:rgba(207,207,214,.9); --line-strong:rgba(150,150,160,.55);
  --primary:#2e63c8; --on-primary:#ffffff; --primary-dim:#4d8eff;
  --secondary:#55617a; --tertiary:#b5450f; --on-tertiary:#ffffff;
  --error:#b3261e; --ok:#1f7a4d;
}
*{box-sizing:border-box;margin:0;padding:0}
html{color-scheme:dark}
html[data-theme="light"]{color-scheme:light}
html,body{height:100%}
body{
  background:var(--bg); color:var(--on-surface);
  font-family:var(--font-sans); font-size:13px; line-height:18px;
  letter-spacing:-0.003em; -webkit-font-smoothing:antialiased; overscroll-behavior:none;
}
::selection{background:var(--primary); color:var(--on-primary)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--surface-highest);border-radius:5px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font-family:inherit;color:inherit}
a{color:inherit;text-decoration:none}
.mono{font-family:var(--font-mono)}

/* ---------- type scale ---------- */
.t-10{font-size:10px;line-height:12px}
.t-11{font-size:11px;line-height:14px}
.t-12{font-size:12px;line-height:16px}
.t-13{font-size:13px;line-height:18px}
.t-14{font-size:14px;line-height:22px;letter-spacing:-0.005em}
.t-15{font-size:15px;line-height:20px;font-weight:600;letter-spacing:-0.01em}
.t-18{font-size:18px;line-height:24px;font-weight:600;letter-spacing:-0.015em}
.t-24{font-size:24px;line-height:32px;font-weight:600;letter-spacing:-0.02em}
.uc{text-transform:uppercase;letter-spacing:.08em}
.dim{color:var(--on-variant)} .faint{color:var(--outline)} .accent{color:var(--primary)} .warn{color:var(--tertiary)} .ok{color:var(--ok)}
.bold{font-weight:600}
.nowrap{white-space:nowrap}
.hidden{display:none!important}

/* ---------- icons (inline SVG) ---------- */
.icon{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.icon-sm{width:15px;height:15px}
.icon-fill{fill:currentColor;stroke:none}

/* ---------- app frame ---------- */
.app-header{
  position:fixed;top:0;left:0;right:0;z-index:50;height:56px;
  background:var(--bg-lowest);border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;padding:0 16px;gap:16px;
}
.app-main{width:100%;min-height:100vh;padding-top:56px;padding-bottom:64px}
.view{display:none}
.view.active{display:block}
.divider{height:1px;background:var(--line);border:none;margin:0}

/* ---------- header ---------- */
.brand{display:flex;align-items:center;gap:8px;user-select:none}
.brand-mark{font-size:15px;font-weight:600;letter-spacing:-0.01em}
.brand-sep{color:var(--outline);font-size:11px}
.brand-name{color:var(--on-variant);font-size:12px}
.version-pill{margin-left:2px;padding:1px 6px;border-radius:4px;background:var(--surface-high);color:var(--on-variant);font-size:10px;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line)}
.nav-seg{display:flex;align-items:center;gap:2px;padding:2px;background:var(--surface-low);border:1px solid var(--line);border-radius:6px;margin-left:4px}
.nav-seg a{display:flex;align-items:center;gap:6px;padding:4px 12px;border-radius:4px;color:var(--on-variant);font-size:12px;transition:color .15s var(--ease),background .15s var(--ease)}
.nav-seg a:hover{color:var(--on-surface)}
.nav-seg a.active{background:var(--surface-high);color:var(--on-surface);border:1px solid var(--line-strong);font-weight:500;padding:3px 11px}
.kbd{font-family:var(--font-mono);font-size:10px;color:var(--outline);background:var(--bg-lowest);border:1px solid var(--line);border-radius:4px;padding:1px 4px;line-height:1.4}
.header-right{display:flex;align-items:center;gap:10px}
#btn-sidebar{display:none}
.engine-status{display:flex;align-items:center;gap:6px;padding:5px 10px;border-radius:6px;background:var(--surface-low);border:1px solid var(--line);font-size:11px;color:var(--on-variant)}
.engine-status:hover{border-color:var(--line-strong);cursor:pointer}
.eng-tip{position:fixed;z-index:1200;max-width:360px;padding:9px 11px;border-radius:8px;background:var(--surface-low);border:1px solid var(--line-strong);box-shadow:0 8px 20px rgba(0,0,0,.28);font-size:11.5px;line-height:1.6;color:var(--on-variant);white-space:pre-wrap;pointer-events:none}
.dot{width:6px;height:6px;border-radius:50%;background:var(--ok);flex-shrink:0}
.dot.warn{background:var(--warning)}
.dot.pulse{animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 12px;
  border-radius:6px;font-size:12px;color:var(--on-variant);background:var(--surface-low);
  border:1px solid transparent;user-select:none;transition:color .15s var(--ease),background .15s var(--ease),border-color .15s var(--ease),opacity .15s var(--ease);
}
.btn:hover{color:var(--on-surface);border-color:var(--line-strong)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.5;cursor:default;pointer-events:none}
.btn-primary{background:var(--primary);color:var(--on-primary);font-weight:600;border-color:transparent}
.btn-primary:hover{background:var(--primary-dim);border-color:transparent}
.btn-danger{background:var(--error-container);color:var(--on-error-container);border-color:transparent;font-weight:600}
.btn-danger:hover{background:var(--error);color:var(--on-error);border-color:transparent}
.btn-ghost{background:transparent;color:var(--outline)}
.btn-ghost:hover{color:var(--on-surface);border-color:transparent;background:transparent}
.btn-sm{height:28px;padding:0 10px;font-size:11px;border-radius:5px}
.btn-icon{width:32px;height:32px;padding:0;border-radius:6px;background:transparent;color:var(--on-variant)}
.btn-icon:hover{background:var(--surface-low);color:var(--on-surface)}
.btn-lg{height:38px;padding:0 18px;font-size:13px;border-radius:8px}

/* ---------- inputs ---------- */
.input{
  width:100%;height:48px;padding:0 16px;background:var(--surface-low);color:var(--on-surface);
  border:1px solid transparent;border-radius:8px;font-size:14px;outline:none;
  transition:background .15s var(--ease),border-color .15s var(--ease);
}
.input::placeholder{color:var(--outline)}
.input:focus{background:var(--surface);border-color:var(--primary-dim)}
.input-group{position:relative;display:flex;align-items:center;width:220px}
.input-group .input{width:100%;padding-right:38px}
.eye-btn{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:30px;height:30px;display:flex;align-items:center;justify-content:center;border:none;background:none;color:var(--outline);cursor:pointer;border-radius:6px;transition:color .12s var(--ease),background .12s var(--ease)}
.eye-btn:hover{color:var(--on-surface);background:var(--surface-high)}
.eye-btn .icon-sm{width:16px;height:16px}
.range{width:150px;accent-color:var(--primary);cursor:pointer;height:4px}
.temp-val{font-family:var(--font-mono);font-size:12px;color:var(--on-surface);min-width:34px;text-align:right}
.tts-voice-zone{display:flex;flex-direction:column;gap:8px;width:100%;min-width:0}
.dev-tts-ctrl .input{width:250px;height:32px;font-size:12px;padding:0 10px}
.tts-voice-zone .input{width:100%;min-height:100px;font-size:13px;line-height:1.6;padding:10px 12px;resize:vertical;height:auto;box-sizing:border-box}
.tts-voice-foot{display:flex;align-items:center;gap:10px;min-width:0;align-self:flex-start}
.voice-roles{display:flex;flex-direction:column;gap:6px;width:100%;min-width:0}
.voice-role-row{display:flex;align-items:center;gap:6px;flex-wrap:nowrap;min-width:0;width:100%}
.role-name{width:104px;flex-shrink:0;height:34px;padding:0 10px;font-size:12.5px;background:var(--surface-low);color:var(--on-surface);border:1px solid transparent;border-radius:6px;outline:none;transition:background .15s var(--ease),border-color .15s var(--ease)}
.role-name:focus{background:var(--surface-high);border-color:var(--primary-dim)}
.voice-role-row .select-wrap{flex:1;min-width:0}
.voice-role-row .select{width:100%;height:34px;font-size:12.5px}
.btn-role-test,.btn-role-del{width:26px;height:34px;flex-shrink:0;display:flex;align-items:center;justify-content:center;border:none;background:var(--surface-low);color:var(--outline);border-radius:6px;cursor:pointer;transition:color .12s var(--ease),background .12s var(--ease)}
.btn-role-test:hover{color:var(--primary);background:var(--surface-high)}
.btn-role-test.loading{color:var(--primary);pointer-events:none;opacity:.85}
.btn-role-test.loading .icon{animation:roleSpin .7s linear infinite}
.btn-role-test.played{color:var(--primary);background:var(--surface-high)}
.btn-role-test.played .icon{animation:none}
@keyframes roleSpin{to{transform:rotate(360deg)}}
.btn-role-del:hover{color:var(--err);background:var(--surface-high)}
.btn-role-test .icon{width:12px;height:12px}
.btn-role-add{align-self:flex-start;display:flex;align-items:center;gap:5px;height:28px;padding:0 10px;font-size:11px;color:var(--on-variant);background:var(--surface-low);border:1px dashed var(--line-strong);border-radius:6px;cursor:pointer;transition:color .12s var(--ease),background .12s var(--ease)}
.btn-role-add:hover{color:var(--on-surface);background:var(--surface-high)}
.btn-role-add .icon{width:12px;height:12px}
.input-sm{height:32px;font-size:13px;border-radius:6px;padding:0 10px}
.select-wrap{position:relative}
.select{
  width:100%;height:34px;padding:0 30px 0 12px;appearance:none;background:var(--surface-low);
  border:1px solid transparent;border-radius:6px;font-size:12px;color:var(--on-surface);outline:none;cursor:pointer;
  transition:background .15s var(--ease),border-color .15s var(--ease);
}
.select:hover{background:var(--surface)}
.select:focus{background:var(--surface);border-color:var(--primary-dim)}
.select-arrow{position:absolute;right:9px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--outline)}
label.flabel{display:block;font-size:12px;font-weight:600;letter-spacing:.01em;color:var(--on-variant);margin-bottom:7px}

/* ---------- segmented control ---------- */
.seg{display:grid;gap:2px;padding:2px;background:var(--surface-low);border:1px solid var(--line);border-radius:6px}
.seg-item{padding:6px 8px;text-align:center;font-size:11px;color:var(--on-variant);border-radius:4px;cursor:pointer;user-select:none;transition:color .15s var(--ease),background .15s var(--ease)}
.seg-item:hover{color:var(--on-surface)}
.seg-item.active{background:var(--surface-high);color:var(--on-surface);font-weight:500}

/* ---------- tags / pills ---------- */
.preset-tag{font-size:11px;padding:4px 10px;background:var(--surface-low);border-radius:6px;color:var(--on-variant);border:1px solid transparent;transition:all .15s var(--ease)}
.preset-tag:hover{background:var(--surface);color:var(--on-surface)}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 7px;border-radius:4px;background:var(--surface-high);color:var(--on-variant);font-size:10px;line-height:1.5}
.pill.accent-pill{color:var(--primary);font-weight:500}
.pill.mono{font-family:var(--font-mono)}

/* ---------- panels ---------- */
.panel{background:var(--bg-lowest);border:1px solid var(--line);border-radius:8px}
.panel-pad{padding:16px}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.panel-title{display:flex;align-items:center;gap:8px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--on-variant)}
.panel-title .icon{width:14px;height:14px}

/* ---------- transcript ---------- */
.transcript{background:var(--bg-lowest);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.trow{padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer;position:relative;transition:background .15s var(--ease)}
.trow:last-child{border-bottom:none}
.trow:hover{background:var(--surface-low)}
.trow.active{background:var(--surface-highest);box-shadow:inset 3px 0 0 var(--primary)}
.trow-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:6px}
.trow-id{display:flex;align-items:center;gap:8px;min-width:0}
.speaker-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.trow-time{font-family:var(--font-mono);font-size:11px;color:var(--outline);flex-shrink:0}
.trow.active .trow-time{color:var(--primary);font-weight:500}
.speaker-name{font-size:11px;font-weight:600}
.speaker-role{font-size:11px;color:var(--outline)}
.trow-actions{display:flex;align-items:center;gap:2px;opacity:0;transition:opacity .15s var(--ease);flex-shrink:0}
.trow:hover .trow-actions,.trow.active .trow-actions{opacity:1}
.trow-actions button{display:inline-flex;align-items:center;justify-content:center;width:24px;height:22px;border-radius:4px;color:var(--outline)}
.trow-actions button:hover{background:var(--surface-high);color:var(--on-surface)}
.trow-actions button.active{color:var(--primary)}
.trow-actions button.active::after{content:"";position:absolute;left:20%;right:20%;bottom:1px;height:1.5px;background:var(--primary)}
.pb-loop-btn.on{border-color:var(--primary);color:var(--primary)}
.trow-actions .rate-btn{width:auto;padding:0 5px;font-family:var(--font-mono);font-size:10px}
.trow-en{font-size:13.5px;line-height:20px;margin-top:2px}
.trow-zh{font-size:12px;line-height:17px;color:var(--on-variant);margin-top:3px;transition:opacity .2s var(--ease)}
.zh-toggle{display:flex;align-items:center;gap:5px;font-size:10px;font-family:var(--mono);letter-spacing:.04em;color:var(--outline);cursor:pointer;padding:2px 6px;border-radius:5px;border:1px solid transparent;transition:all .15s var(--ease)}
.zh-toggle:hover{color:var(--on-surface)}
.zh-toggle.on{color:var(--primary);background:var(--surface-low);border-color:var(--line)}
.playing-flag{display:inline-flex;align-items:center;gap:4px;font-size:10px;color:var(--primary);margin-left:6px}
.playing-flag .dot{background:var(--primary)}
.playing-flag.paused{color:var(--warning)}
.playing-flag.paused .dot{background:var(--warning)}
.blind-mode .trow-zh{opacity:0}
.blind-mode .trow-en{filter:blur(5px);transition:filter .2s var(--ease)}
.blind-mode .trow-en:hover{filter:none}

/* ---------- tabs (inspector) ---------- */
.tabbar{display:flex;align-items:center;gap:2px;padding:8px 8px 0;overflow-x:auto;flex-shrink:0}
.tab-btn{display:inline-flex;align-items:center;gap:6px;padding:7px 11px;font-size:11px;color:var(--outline);border-radius:6px 6px 0 0;white-space:nowrap;transition:color .15s var(--ease),background .15s var(--ease)}
.tab-btn:hover{color:var(--on-surface)}
.tab-btn.active{background:var(--surface);color:var(--on-surface);font-weight:500}
.tab-panel{display:none;flex:1;overflow-y:auto;padding:14px;background:var(--surface);gap:14px}
.tab-panel.active{display:flex;flex-direction:column}

/* ---------- library sidebar ---------- */
.lib-sidebar{width:288px;flex-shrink:0;background:var(--bg-lowest);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
.lib-scroll{flex:1;overflow-y:auto;padding:8px 12px 16px}
.lib-section{margin-bottom:22px}
.lib-section-head{display:flex;align-items:center;justify-content:space-between;padding:4px 8px 6px}
.lib-item{display:flex;align-items:flex-start;gap:10px;padding:8px;border-radius:6px;cursor:pointer;color:var(--on-variant);transition:background .15s var(--ease)}
.lib-item:hover{background:var(--surface-low);color:var(--on-surface)}
.lib-new-btn{display:flex;align-items:center;gap:9px;width:100%;padding:7px 10px;border-radius:6px;
  border:1px solid var(--line);background:var(--surface-low);color:var(--on-variant);cursor:pointer;
  font:inherit;text-align:left;transition:background .15s var(--ease),border-color .15s var(--ease)}
.lib-new-btn:hover{border-color:var(--primary);color:var(--on-surface);background:var(--surface-container)}
.lib-new-btn .ln-ic{width:24px;height:24px;border-radius:6px;background:var(--surface);display:flex;
  align-items:center;justify-content:center;color:var(--primary);flex-shrink:0}
.lib-new-btn .ln-ic .icon{width:13px;height:13px}
.lib-new-btn .ln-name{font-size:12px;font-weight:500;color:var(--on-surface)}
.lib-item.active{background:var(--surface-high);color:var(--on-surface);box-shadow:inset 2px 0 0 var(--primary)}
.lib-ic{width:26px;height:26px;border-radius:6px;background:var(--surface-low);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--outline)}
.lib-item.active .lib-ic{background:var(--primary);color:var(--on-primary)}
.lib-ic .icon{width:14px;height:14px}
.lib-item-body{flex:1;min-width:0}
.lib-item-title{display:flex;align-items:center;justify-content:space-between;gap:8px}
.lib-item-name{font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lib-item-dur{font-family:var(--font-mono);font-size:10px;color:var(--outline);flex-shrink:0}
.lib-item-meta{display:flex;align-items:center;gap:6px;margin-top:3px;font-size:10px;color:var(--outline)}
.lib-item-actions{display:none;align-items:center;gap:2px;flex-shrink:0;margin-left:2px}
.lib-item:hover .lib-item-actions{display:flex}
.lib-act{display:flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:4px;color:var(--outline);cursor:pointer;transition:color .12s var(--ease),background .12s var(--ease)}
.lib-act:hover{color:var(--on-surface);background:var(--surface-highest)}
.lib-act.del:hover{color:var(--error)}
.bm-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;cursor:pointer;background:var(--surface);transition:border-color .12s var(--ease),background .12s var(--ease)}
.bm-row:hover{background:var(--surface-highest)}
.lib-item.confirm-del{border:1px solid var(--error);background:var(--surface-low)}
.lib-item.confirm-del .lib-act.del{color:var(--error)}
.lib-draft{font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--primary);border:1px solid var(--line-strong);padding:0 4px;border-radius:3px;margin-left:6px;flex-shrink:0}
.lib-draft.unsynth{color:var(--warning);border-color:rgba(232,179,57,.4)}
.lib-item.renaming .lib-item-name{display:none}
.lib-rename-input{font:inherit;font-size:12px;font-weight:500;background:var(--surface-highest);border:1px solid var(--outline);border-radius:4px;color:var(--on-surface);padding:2px 6px;width:100%;min-width:0}
.lib-item.renaming .lib-item-dur{display:none}
.playlist-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 8px;border-radius:6px;cursor:pointer;color:var(--on-variant);transition:background .15s var(--ease),color .15s var(--ease)}
.playlist-row:hover{background:var(--surface-low);color:var(--on-surface)}
.playlist-row.active{background:var(--surface-high);color:var(--on-surface)}
.pl-wrap{position:relative}
.pl-expand{display:none;margin:2px 0 8px 14px;padding:2px 4px 4px 12px;border-left:2px solid var(--line)}
.playlist-row.active + .pl-expand{display:block}
.pl-item{display:flex;align-items:center;gap:7px;padding:5px 6px;border-radius:5px;cursor:pointer;color:var(--on-variant);font-size:11.5px;transition:background .12s var(--ease)}

.radio-row input{accent-color:var(--primary);margin:0}
.usage-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.usage-chart-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:14px 0 8px}
.usage-chart{width:100%;height:150px;border:1px solid var(--line);border-radius:7px;background:var(--surface-low);overflow:hidden}
.usage-chart svg{display:block;width:100%;height:100%}
.usage-bar{cursor:pointer;transition:fill .12s var(--ease)}
.usage-bar:hover{stroke:var(--primary);stroke-width:1}
.icon-btn{background:var(--surface-low);border:1px solid var(--line);border-radius:6px;color:var(--on-variant);cursor:pointer;transition:all .12s var(--ease)}
.icon-btn:hover{color:var(--on-surface);border-color:var(--outline);background:var(--surface-highest)}
.usage-cell{display:flex;flex-direction:column;gap:3px;padding:12px 14px;background:var(--surface-low);border:1px solid var(--line);border-radius:7px}
.usage-days{display:flex;flex-direction:column;gap:4px;margin-top:8px}
.usage-day{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 10px;background:var(--surface-low);border:1px solid var(--line);border-radius:6px;font-size:11px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.test-grid{grid-template-columns:auto 1fr auto}
.test-result{font-family:var(--font-mono);font-size:10px;color:var(--outline);align-self:center;min-height:14px}
.test-result.ok{color:var(--primary)}
.test-result.err{color:var(--error)}
.api-note{font-family:var(--font-mono);font-size:10px;color:var(--outline);background:var(--bg-lowest);border:1px solid var(--line);border-radius:6px;padding:10px;line-height:1.7;white-space:pre-wrap}

/* ---------- toast ---------- */
.toast{
  position:fixed;bottom:84px;left:50%;transform:translateX(-50%) translateY(12px);z-index:500;
  background:var(--surface-high);border:1px solid var(--line-strong);color:var(--on-surface);
  padding:10px 16px;border-radius:9px;font-size:12px;line-height:1.55;
  display:flex;align-items:center;gap:10px;
  max-width:min(480px,calc(100vw - 48px));white-space:normal;word-break:break-word;
  box-shadow:0 8px 28px rgba(0,0,0,.16),0 2px 8px rgba(0,0,0,.10);
  opacity:0;pointer-events:none;transition:opacity .22s var(--ease),transform .22s var(--ease);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
.toast .toast-ic{flex:none;width:22px;height:22px;padding:3px;border-radius:50%;background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)}
.toast.success .toast-ic{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}
.toast.error .toast-ic{background:color-mix(in srgb,var(--error) 14%,transparent);color:var(--error)}
.toast.warn .toast-ic{background:color-mix(in srgb,var(--warning) 16%,transparent);color:var(--warning)}

/* ---------- responsive ---------- */
@media (max-width:1180px){ .inspector{width:330px} }
@media (max-width:960px){
  .inspector{width:0!important;border-left:none;overflow:hidden}

/* ---------- Unified workspace: generate panel & header trigger ---------- */
.gen-trigger{display:flex;align-items:center;gap:9px;height:34px;padding:0 18px;border-radius:8px;background:var(--primary);border:1px solid transparent;color:var(--on-primary);font-size:13px;font-weight:600;letter-spacing:-0.01em;cursor:pointer;transition:filter .15s var(--ease),transform .15s var(--ease);flex-shrink:0}

.gen-trigger .icon{color:var(--on-primary);opacity:.9}
.synth-banner{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 12px;margin-bottom:12px;background:var(--surface-high);border:1px solid var(--line);border-radius:8px}

.gen-backdrop{position:absolute;inset:0;background:rgba(5,6,8,.55);backdrop-filter:blur(2px)}

.gen-card{position:relative;width:700px;max-width:100%;background:var(--surface-low);border:1px solid var(--line-strong);border-radius:10px;box-shadow:0 24px 64px rgba(0,0,0,.45);overflow:hidden;display:flex;flex-direction:column;animation:genIn .18s cubic-bezier(.22,.61,.36,1)}

.gen-card-head{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line);flex-shrink:0}
.gen-card-body{padding:16px;display:flex;flex-direction:column;gap:14px;max-height:64vh;overflow-y:auto}
.gen-topic-row{display:flex;align-items:center;gap:10px;padding:0 14px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface-highest);color:var(--outline);transition:border-color .15s var(--ease),color .15s var(--ease)}

@media (max-width:720px){
  .gen-trigger span.kbd{display:none}

async function apiFetch(path, opts, timeoutMs) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), timeoutMs || 60000);
  let res;
  try {
    res = await fetch(CONFIG.apiBase + path, Object.assign({ signal: ctrl.signal }, opts || {}));
  } catch (e) {
    clearTimeout(timer);
    throw new Error('Cannot reach backend at ' + CONFIG.apiBase + ' — start FastAPI (backend/main.py) on port 8000');

  _key: 'telg-auth',
  _read() { try { return JSON.parse(localStorage.getItem(this._key) || 'null') || null; } catch (e) { return null; } },
  _write(a) { try { localStorage.setItem(this._key, JSON.stringify(a)); } catch (e) {} },
